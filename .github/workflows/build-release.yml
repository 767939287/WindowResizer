name: Build and Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        run: msbuild WindowResizer.sln /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143

      - name: Collect artifact
        run: |
          New-Item -ItemType Directory -Force -Path output | Out-Null
          Write-Host "Searching for built exe..."
          Get-ChildItem -Path . -Recurse -Filter WindowResizer.exe -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host $_.FullName }
          $exe = Get-ChildItem -Path . -Recurse -Filter WindowResizer.exe -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match '\\x64\\' } |
                 Sort-Object LastWriteTime -Descending |
                 Select-Object -First 1
          if (-not $exe) { throw "WindowResizer.exe (x64) not found" }
          Write-Host "Using: $($exe.FullName)"
          Copy-Item $exe.FullName "output\WindowResizer-x64.exe"

      - name: Upload x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowResizer-x64
          path: output/WindowResizer-x64.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/WindowResizer-x64.exe
          generate_release_notes: ${{ github.event_name == 'push' }}



