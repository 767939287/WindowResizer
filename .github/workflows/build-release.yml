name: Build and Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x86
        run: msbuild WindowResizer.sln /m /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v141

      - name: Build Release x64
        run: msbuild WindowResizer.sln /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v141

      - name: Collect artifacts
        run: |
          New-Item -ItemType Directory -Force -Path output | Out-Null
          Copy-Item "WindowResizer\Release\WindowResizer.exe" "output\WindowResizer-x86.exe"
          Copy-Item "WindowResizer\x64\Release\WindowResizer.exe" "output\WindowResizer-x64.exe"

      - name: Upload x86 artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowResizer-x86
          path: output/WindowResizer-x86.exe

      - name: Upload x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowResizer-x64
          path: output/WindowResizer-x64.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/WindowResizer-x86.exe
            output/WindowResizer-x64.exe
          generate_release_notes: ${{ github.event_name == 'push' }}


